<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101318" />
  <title>Living Room</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main class="remote">
    <h1>Living Room</h1>
    <p id="status" class="status">connecting…</p>

    <section class="group">
      <button data-cmd='{"type":"launch","app":"geforce"}'>GeForce NOW</button>
      <button data-cmd='{"type":"launch","app":"netflix"}'>Netflix</button>
      <button data-cmd='{"type":"launch","app":"prime"}'>Prime Video</button>
      <button data-cmd='{"type":"launch","app":"youtube"}'>YouTube</button>
    </section>

    <section id="yt" class="yt" hidden>
      <p id="yt-conn" class="status"></p>
      <div id="yt-now" class="now" hidden></div>

      <div class="dpad">
        <span></span>
        <button data-cmd='{"type":"navigate","direction":"up"}'>▲</button>
        <span></span>
        <button data-cmd='{"type":"navigate","direction":"left"}'>◀</button>
        <button data-cmd='{"type":"select"}' class="ok">OK</button>
        <button data-cmd='{"type":"navigate","direction":"right"}'>▶</button>
        <span></span>
        <button data-cmd='{"type":"navigate","direction":"down"}'>▼</button>
        <button data-cmd='{"type":"back"}'>Back</button>
      </div>

      <div class="transport">
        <button data-cmd='{"type":"seek","seconds":-10}'>−10s</button>
        <button data-cmd='{"type":"playPause"}'>❚❚ / ▶</button>
        <button data-cmd='{"type":"seek","seconds":10}'>+10s</button>
        <button data-cmd='{"type":"fullscreen"}'>⛶ Full</button>
      </div>

      <form id="yt-search" class="search">
        <input id="yt-q" type="search" placeholder="Search YouTube…" autocomplete="off" />
        <button type="submit">Go</button>
      </form>

      <h2>On TV <span id="yt-screen" class="dim"></span></h2>
      <div id="yt-items" class="list"></div>

      <h2>History</h2>
      <div id="yt-history" class="list"></div>
    </section>

    <section class="group vol">
      <button data-cmd='{"type":"volume","action":"down"}'>Volume −</button>
      <button data-cmd='{"type":"volume","action":"mute"}'>Mute</button>
      <button data-cmd='{"type":"volume","action":"up"}'>Volume +</button>
    </section>

    <section class="group">
      <button data-cmd='{"type":"home"}' class="home">Home</button>
    </section>

    <p id="state" class="state"></p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
